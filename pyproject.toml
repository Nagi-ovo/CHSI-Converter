[project]
name = "chsi-converter"
version = "2.0.0"
description = "学信网英文档案一键转换"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2,<4",
    "werkzeug>=3.1.3,<4",
    "pypdf>=6.18.1,<7",
    "pypinyin>=0.55,<1",
    "reportlab>=4,<5",
    "gunicorn>=23,<24",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
